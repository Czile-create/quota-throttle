# 复制为 config.toml 后填写。一键起：cargo run --release -- up config.toml
#
# 子命令：
#   up    下载/启动 new-api（配了 [new_api.manage] 时）→ sync 建渠道 → 进入切换循环
#   sync  只建/对齐渠道并打印 name→channel_id，不进循环
#   run   假设 new-api 已在跑，只解析渠道并进入切换循环
#   down  停掉本工具托管的 new-api

poll_interval_secs = 60      # 轮询智谱用量的间隔（秒）

# 【预防线】活动 key 用量达到这个百分比 → 在撞墙前切到下一把。
throttle_threshold = 95.0
# 挑「新活动 key」时要求用量低于这个值（比 throttle 低，多留余量 → 切换更少 → 缓存更稳）。
restore_threshold = 90.0
# 【真·用尽线】物理上没余量了。与预防线是两条不同的线：
#   · 正常情况下只在 pct < throttle 的 key 里选（还有 5% 余量就该提前换，护缓存）。
#   · 但当**全部 key 都越过预防线**时，判定放宽到这条线——只要 pct < exhausted 就还能用。
#     否则会出现「明知另一把 96% 还有余量，却继续钉着已经 100% 的 key 撞 429」。
# ⚠️ 智谱只返回整数 percentage（无 usage/remaining），所以这里的分辨率就是 1%。
exhausted_threshold = 100.0

# 【周临期优先】周窗口重置进入这个时间窗（小时）内的 key 视为「临期」：
#   切换时会优先选它——快清零的额度用掉比浪费强（最大化额度使用效率）。
#   · 判定条件：周窗口将在 N 小时内重置 ∧ 周窗口还有余量(<exhausted) ∧ 5h 窗口也还有余量。
#   · 只在**发生切换**时影响排序；现任合格就不换（粘滞政策不变）。
#   · 0 = 关闭本策略（行为与旧版完全一致）。建议 6–48h；上限 168（一周）。
weekly_reset_lookahead_hours = 24

dry_run = true               # 先 true 空跑验证日志；确认无误再改 false 真正生效
watch_windows = ["five_hour", "weekly"]   # 同时盯 5 小时和每周窗口，取最大使用率

# 状态看板：浏览器打开 http://127.0.0.1:3001 看每把 key 的 5h/周 用量、档位、当前活动 key，
# 还能固定活动 key、加/删 key。同地址下 /api/status 是 JSON 接口（外部消费者读它）。
# 留空则不启用看板。
# ⚠️ 看板能改调度状态、还收智谱 key —— **只绑回环地址**。绑 0.0.0.0 等于把控制面暴露给整个网段。
status_addr = "127.0.0.1:3001"

# 看板**面板数据**（渠道实况 / rpm/tpm / 请求流水 / 近 24h 曲线）的刷新间隔（秒）。
# 与智谱用量轮询 poll_interval_secs **分离**：new-api 是本地服务（毫秒级纯读）可以高频；
# 智谱是外部 API，该低频。
panel_interval_secs = 5

# 三档 priority（一般不用改）。new-api 优先路由最高 priority 的渠道：
# active 独占最高档吃走所有正常流量；standby 作 429 兜底；exhausted 是最后手段。
priority_active = 100
priority_standby = 10
priority_exhausted = 0

# ⚠️ 以下都是「表」（[xxx] 开头）。TOML 规则：表头一旦出现，后面所有裸 key = value 都归它，
#    直到下一个表头。所以**顶层配置项必须全部写在这行以上**，写到下面会被静默吞进某个表里
#    （程序不报错，只是那项走默认值——最阴的那类 bug，我踩过）。

# ——— 智谱高峰时段（只在看板上显示，不参与调度决策）———
# 这不是限额，是**扣减系数**：同一个请求在高峰期烧掉的额度更多。
# 依据（2026-07 官方文档 docs.bigmodel.cn/cn/coding-plan/faq，已交叉验证）：
#   · 高峰期 = 每日 14:00–18:00（UTC+8），固定，不随流量浮动
#   · GLM-5.2 / GLM-5-Turbo：高峰 3 倍、非高峰 2 倍；
#     **限时福利**：非高峰仅 1 倍，持续到 9 月底 → 到期后把下面的 off_peak 改回 2.0
#   · GLM-4.7 等普通模型：1 倍（不必列出）
# ⚠️ 智谱没有任何接口能查「现在是不是高峰」，只能按时钟算。窗口按 UTC+8 定义，
#    所以这里配的是 tz_offset_hours 而不是用本机时区——换台机器也不会算错。
# 不需要这块就整段删掉，看板会自动不显示。
[peak]
start_hour = 14
end_hour = 18
tz_offset_hours = 8
note = "非高峰 1x 是限时福利，到 2026-09 月底；到期后非高峰恢复 2x"

[[peak.coefficients]]
model = "glm-5.2"
peak = 3.0
off_peak = 1.0
[[peak.coefficients]]
model = "glm-5-turbo"
peak = 3.0
off_peak = 1.0

[zhipu]
# ⚠️ 团体套餐必须带 ?type=2（团队额度作用域），否则返回「当前用户不存在coding plan」。
#    个人套餐去掉 ?type=2。国际版 z.ai 换主机。鉴权用 Authorization: Bearer <key>（程序内置）。
quota_url = "https://open.bigmodel.cn/api/monitor/usage/quota/limit?type=2"

# 全局兜底 selector（各 key 未单独配 quota_headers 时用这个）。个人套餐不需要。
# [[zhipu.extra_headers]]
# key = "Bigmodel-Organization"
# value = "org-..."

[new_api]
base_url = "http://127.0.0.1:3000"
channel_path = "/api/channel"
# 管理认证：① 若你已有 new-api 并生成了“系统访问令牌”，填这里，本工具用 Bearer 调管理 API；
#           ② 留空则用下面 root 账号登录（配合 [new_api.manage] 首启自动建管理员）。
admin_token = ""
# admin_token 为空时用它登录 new-api。首启会用它创建管理员（密码需 ≥8 位）。请改成你自己的。
root_username = "root"
root_password = "changeme123"

# 部分 new-api 版本的管理 API 还要额外 header（如 New-Api-User: <管理员 user id>）。
# 一般不用配；若管理 API 返回 401 就 F12 抄一下浏览器发的头填这里。
# [[new_api.extra_headers]]
# key = "New-Api-User"
# value = "1"

# —— 让本工具自己下载并托管 new-api 原生进程（不用容器）——
# 配了这段，up/sync 会在 new-api 不在跑时按平台下载 release 二进制（sha256 校验）并启动。
# 不想让本工具管 new-api（自己部署）就删掉整段 [new_api.manage]，用 run 子命令。
[new_api.manage]
version = "v1.0.0-rc.20"     # GitHub release tag
port = 3000                  # 应与 base_url 端口一致
data_dir = "./.newapi"       # 二进制 / SQLite / 日志 / PID 都放这里
repo = "QuantumNous/new-api"
# 启动时自动把管理用户的 new-api 内部额度调到多少**货币单位**（1 单位 = 500000 quota，
# 只调大不调小，直写 SQLite 运行中生效）。new-api 给包月套餐按倍率虚构记账，
# 额度见底会 403 挡转发——默认 2 亿基本烧不完，一般不用动。
# root_user_quota_units = 200000000

# —— sync 建渠道用的模板（版本相关字段，建议 F12 对齐）——
# sync 会把每把 key 的 name/key 合并进来，一 key 一渠道；有它才能自动建渠道。
[new_api.channel_template]
# 智谱编码套餐口是 /coding/paas/v4/chat/completions（/v4 不是 /v1）。已实测：必须用 Custom
# 类型(8) 原样透传全路径；OpenAI 类型(1) 会拼成 /v4/v1/... 报 404。
type = 8
base_url = "https://open.bigmodel.cn/api/coding/paas/v4/chat/completions"
# 仅作 /models 探测失败时的新渠道 fallback；平时以每把 key 的实时返回为准。
models = "glm-4.5,glm-4.5-air,glm-4.6,glm-4.7,glm-5,glm-5-turbo,glm-5.1,glm-5.2,glm-5.3,glm-5.3-flash"
group = "default"

[new_api.channel_template.model_discovery]
# 这一段可显式覆盖；旧智谱 Coding 模板即使缺少本段，也会自动使用同一官方端点。
url = "https://open.bigmodel.cn/api/coding/paas/v4/models"
auth = "bearer"              # Authorization: Bearer <key>

# —— Claude Code 下游接入（无需额外渠道、group 或 key）——
# NewAPI 原生在 /v1/messages 接收 Anthropic 格式，并转换到上面的同一批 type 8 渠道。
# Claude Code 与 OpenAI/opencode 客户端使用**同一把 NewAPI 访问 key**；这里只需设置：
#   ANTHROPIC_BASE_URL=http://127.0.0.1:3000
#   ANTHROPIC_AUTH_TOKEN=<与 opencode 使用的相同 NewAPI key>

# —— 一把智谱 key = 一个独立渠道 ——
# name 同时用作 new-api 渠道名，sync 靠它解析/创建渠道。channel_id 可留空，交给 sync 自动解析。
# 只有 >=2 把 key 时本工具才有意义（轮着用）。
[[keys]]
name = "zhipu-1"
zhipu_api_key = "第一把智谱 key"
# note = "wang"    # 可选：人类可读备注（如持有人名字），只在看板显示。⚠️ 必须写在 quota_headers 之前
# channel_id = 1   # 可选：已有渠道时显式指定；留空则按 name 自动解析/创建
# —— 团体套餐必需的 selector；不同 key 可能属不同组织/项目，故按 key 配 ——
# 取法：浏览器打开 https://bigmodel.cn/coding-plan/team/usage-stats → F12 Network →
#       刷新 → 找 api/monitor/usage/quota/limit 请求 → 复制它带的这两个请求头
[[keys.quota_headers]]
key = "Bigmodel-Organization"
value = "org-..."
[[keys.quota_headers]]
key = "Bigmodel-Project"
value = "proj_..."

[[keys]]
name = "zhipu-2"
zhipu_api_key = "第二把智谱 key"
[[keys.quota_headers]]
key = "Bigmodel-Organization"
value = "org-..."
[[keys.quota_headers]]
key = "Bigmodel-Project"
value = "proj_..."

# —— 缓存命中池代理（F4）：逐请求路由（默认关；关 = 客户端直连 new-api 的旧拓扑）——
# 开启后代理接管 base_url 的端口（客户端/opencode/Claude Code/docker 端口映射零改动），
# new-api 挪到内部端口（托管模式把上面 [new_api.manage].port 改成 13000 即可；
# 校验会拦住「代理端口 = upstream 端口」的冲突配置）。
# 非 LLM 路径（new-api 管理界面等）经代理原样透传。
# ⚠️ 首次开启前先 `quota-throttle down config.toml` 停掉还占着 3000 的旧 new-api。
#[cache_pool]
#enabled = true
#upstream_url = ""             # 仅非托管模式（无 [new_api.manage]）必填：外部 new-api 地址
#weekly_to_five_hour_ratio = 4.4285714286   # 周额度总量:5h 额度总量（默认 15.5/3.5）
#max_concurrency = 64          # 并发上限（按连接计，慢客户端占坑即背压）
#max_body_bytes = 16777216     # 单请求体上限（16MiB），超限 413
